name: cache

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - channel: nixos-26.05
        - channel: nixpkgs-unstable
    runs-on: ubuntu-latest
    outputs:
      pages-artifact: ${{ steps.upload-pages.outputs.artifact_id }}
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: wimpysworld/nothing-but-nix@main
      with:
        nix-permission-edict: true
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          allow-import-from-derivation = false
          keep-going = true
          show-trace = true
        nix_path: nixpkgs=channel:${{ matrix.channel }}
    - uses: cachix/cachix-action@v17
      with:
        name: hmenke
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        pushFilter: "(-source$|nixpkgs.tar.gz$)"
    - name: Run nix build
      run: nix build --print-build-logs --no-link --file ./default.nix
    - name: Prepare archive and pages
      if: ${{ matrix.channel == 'nixos-26.05' }}
      shell: bash
      env:
        LC_ALL: C
      run: |
        nix build --file ./default.nix -o .local local-bin

        # Create archive
        tar --create --file=- --verbose --format=gnu \
          --sort=name \
          --mtime="@${SOURCE_DATE_EPOCH:-315532800}" \
          --owner=0 --group=0 --numeric-owner \
          --mode='u+rwX,go+rX' \
          --dereference --hard-dereference \
          .local/bin/* .local/share/* |
          gzip --no-name --rsyncable > .gh-pages/local-bin-share.tar.gz

        # Compute checksums
        (cd .gh-pages && sha256sum bootstrap.sh local-bin-share.tar.gz > SHA256SUMS)

        # Prepare pages
        tar --list --gzip --file=.gh-pages/local-bin-share.tar.gz |
          sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' |
          sed -i -e '/^@CONTENTS@$/{r /dev/stdin' -e 'd}' .gh-pages/index.html
        sed -i -e '/^@SHA256SUMS@$/{r .gh-pages/SHA256SUMS' -e 'd}' .gh-pages/index.html
        sed -i "s/@UPDATED@/$(date -u '+%Y-%m-%dT%H:%M:%SZ')/g" .gh-pages/index.html
    - name: Upload pages
      id: upload-pages
      if: ${{ matrix.channel == 'nixos-26.05' && github.ref == 'refs/heads/master' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: .gh-pages/

  deploy-pages:
    needs: nix-build
    if: ${{ !cancelled() && needs.nix-build.outputs.pages-artifact && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
