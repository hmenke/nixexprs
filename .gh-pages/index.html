<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nixexprs</title>
    <style>
      :root {
          color-scheme: light dark;
      }

      body {
          font-family: system-ui, sans-serif;
          line-height: 1.5;
          max-width: 48rem;
          margin: 2rem auto;
          padding: 0 1rem;
      }

      pre {
          display: flex;
          align-items: center;
          gap: 1rem;
          padding: 0.75rem 1rem;
          border-radius: 0.5rem;
          background: light-dark(#f4f4f5, #27272a);
          overflow-x: auto;
      }

      pre code {
          flex: 1;
          user-select: all;
          -webkit-user-select: all;
      }

      button {
          font: inherit;
          font-size: 0.875rem;
          padding: 0.25rem 0.75rem;
          border: 1px solid currentColor;
          border-radius: 0.25rem;
          background: none;
          color: inherit;
          cursor: pointer;
      }

      footer {
          margin-top: 2rem;
          font-size: 0.875rem;
          opacity: 0.75;
      }
    </style>
    <noscript>
      <style>
        button {
            display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <h1>nixexprs</h1>
    <p>Install or update <code>~/.local/bin</code> and <code>~/.local/share</code>:</p>
    <pre><code>curl -fsSL https://hmenke.github.io/nixexprs/bootstrap.sh | bash</code><button type="button">Copy</button></pre>
    <pre><code>wget -qO- https://hmenke.github.io/nixexprs/bootstrap.sh | bash</code><button type="button">Copy</button></pre>
    <p>Downloads:</p>
    <ul>
      <li><a href="bootstrap.sh">bootstrap.sh</a></li>
      <li><a href="local-bin-share.tar.gz">local-bin-share.tar.gz</a></li>
    </ul>
    <footer>
      Last updated <time datetime="@UPDATED@">@UPDATED@</time>
      · <a href="https://github.com/hmenke/nixexprs">Source</a>
    </footer>
    <script>
      for (const time of document.querySelectorAll("time")) {
          time.textContent = new Date(time.dateTime).toLocaleString();
      }

      for (const button of document.querySelectorAll("pre button")) {
          button.onclick = async () => {
              await navigator.clipboard.writeText(button.previousElementSibling.textContent);
              button.textContent = "Copied";
          };
      }
    </script>
  </body>
</html>
